  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deliberately the default-minimum. This job runs third-party code.
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
