<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}} | {{site}}</title><link rel="stylesheet" href="{{base}}assets/style.css"></head>
<body><a class="skip" href="#content">Skip to content</a>
<header class="site-header"><a class="site-title" href="{{base}}index.html">{{logo}}{{site}}<span>SDK documentation</span></a><div class="site-links">{{providerLink}}{{repoLink}}</div></header>
<div class="site-notice" role="note">{{notice}}</div>
<div class="shell"><nav class="site-nav" aria-label="Documentation"><div class="search"><label for="search">Search documentation</label><input id="search" type="search" data-base="{{base}}" placeholder="Find a guide or reference"><div id="results" aria-live="polite"></div></div>{{presentationLinks}}{{nav}}</nav><main id="content"><div class="page-context"><span class="section-dot" aria-hidden="true"></span>{{section}}</div>{{content}}</main></div>
<script src="{{base}}assets/search.js" defer></script></body></html>
